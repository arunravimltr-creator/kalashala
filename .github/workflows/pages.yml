name: Build installable app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Collect official NTA notices
        run: node scripts/collect-nta.mjs
        continue-on-error: true
      - name: Build static PWA
        run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
      - name: Locate public output
        id: out
        run: |
          if [ -f dist/client/index.html ]; then
            echo "dir=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f .output/public/index.html ]; then
            echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -f dist/public/index.html ]; then
            echo "dir=dist/public" >> "$GITHUB_OUTPUT"
          elif [ -f dist/index.html ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "No index.html in known output dirs" >&2
            find .output dist -name 'index.html' 2>/dev/null | head
            exit 1
          fi
      - name: Ensure SPA 404 fallback
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          if [ -f "$DIR/index.html" ] && [ ! -f "$DIR/404.html" ]; then
            cp "$DIR/index.html" "$DIR/404.html"
          fi
          touch "$DIR/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
